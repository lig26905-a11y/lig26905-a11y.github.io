<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>回答已收到</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f0e5;color:#0d3928;font-family:"Microsoft YaHei","PingFang SC",sans-serif}.card{width:min(620px,100%);border:1px solid #0d3928;background:#fffaf0;padding:48px;box-shadow:9px 9px 0 #c9f238}.tag{color:#ff7047;font-weight:900;letter-spacing:.16em;font-size:12px}h1{font:500 42px/1.25 Georgia,"Songti SC",serif}p{line-height:1.8;color:#5e6b61}a{display:inline-block;margin-top:20px;color:#fff;background:#0d3928;padding:15px 24px;text-decoration:none;font-weight:800;box-shadow:5px 5px 0 #ff7047}</style></head>
<body><main class="card"><span class="tag">已收到</span><h1>谢谢你认真走进他们的故事。</h1><p id="message">你的意见已经提交。</p><a href="./">返回意见页</a></main><script>(function(){var key="reader_feedback_submissions_v1";if(sessionStorage.getItem("reader_feedback_pending")){var used=Math.min(2,(parseInt(localStorage.getItem(key)||"0",10)||0)+1);localStorage.setItem(key,String(used));sessionStorage.removeItem("reader_feedback_pending");document.getElementById("message").textContent=used>=2?"两次回答均已提交，感谢你的参与。":"你还可以再提交一次不同的想法。"}})();</script></body>
